<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Balance-Simulation</title>
<style>body{background:#111;color:#eee;font:13px/1.5 monospace;padding:16px}</style>
</head>
<body>
<h1>Alphabet Prestige – Balance-Simulation</h1>
<p>Simuliert einen aktiven Spieler (kauft sofort, resettet bei Verdopplung oder wenn das nächste Upgrade dadurch bezahlbar wird, min. 2 s zwischen manuellen Resets).</p>
<pre id="out">läuft …</pre>
<script src="../js/palette.js"></script>
<script src="../js/upgrades.js"></script>
<script src="../js/game.js"></script>
<script src="simcore.js"></script>
<script>
const r = AP.simulate({ log: true, dt: 0.5 });
const t = v => v === undefined ? '–' : AP.fmtT(v);
const sum = ['ZUSAMMENFASSUNG',
  'erster A-Reset: ' + t(r.firstReset.A),
  'AZ:             ' + t(r.bought.AZ),
  'erster B-Reset: ' + t(r.firstReset.B),
  'BZ:             ' + t(r.bought.BZ),
  'erster C-Reset: ' + t(r.firstReset.C),
  'CZ:             ' + t(r.bought.CZ),
  'Punkte am Ende: ' + r.points.toExponential(2), ''];
document.getElementById('out').textContent = sum.concat(r.log).join('\n');
window.simResult = { summary: sum.join('\n'), log: r.log };
</script>
</body>
</html>
