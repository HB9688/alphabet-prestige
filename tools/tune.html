<title>Balance-Tuner</title>
<style>body{background:#111;color:#eee;font:13px/1.5 monospace;padding:16px}</style>

<body>
<h1>Alphabet Prestige – Balance-Tuner</h1>
<p>Sucht Kosten und Reset-Anforderungen so, dass jeder Kauf zum Zielzeitpunkt erreicht wird. Ergebnis in upgrades.js / game.js übernehmen.</p>
<pre id="out">läuft …</pre>
<script src="../js/lib/break_infinity.min.js"></script>
<script src="../js/palette.js"></script>
<script src="../js/upgrades.js"></script>
<script src="../js/game.js"></script>
<script src="simcore.js"></script>
<script>
const out = document.getElementById('out');
// Werte als Zehnerpotenz (Logarithmus) suchen, damit auch Kosten weit über 1e308 möglich sind
const Dec = AP.Decimal, LOCK = new Dec('1e1000000');
const fromLog = l => Dec.pow(10, l);
// auf 2 gültige Stellen runden, z. B. 10^4.37 → 2.3e4
const round2 = l => { const e = Math.floor(l); let m = Math.round(Math.pow(10, l - e + 1)); return new Dec(m + 'e' + (e - 1)); };

// Schritte in zeitlicher Reihenfolge.
// Standard: B und C neu einstellen (?all: auch A). ?layers=D: nur Stufe D – gerechnet ab einem Snapshot bei CZ
// (schnell, A–C bleiben unverändert). Allgemein: ?layers=DE usw. stellt diese Stufen ab dem Tor davor ein.
const params = new URLSearchParams(location.search);
const tuneA = params.has('all');
const layers = (params.get('layers') || 'BC').toUpperCase().split('');
const interval = { A: i => 10 + 9.5 * i, B: i => 60 + 8 * i, C: i => 60 + 8 * i, D: i => 60 + 10 * i };
const resetInterval = { B: 150, C: 150, D: 960 };
const steps = [];
if (tuneA) AP.UPGRADE_ORDER.A.forEach((id, i) => { if (i >= 2) steps.push({ key: id, kind: 'cost', id, interval: interval.A(i) }); });
// ?fixreq=D: req dieser Stufen nicht suchen, sondern den Wert aus game.js behalten (nur Kosten einstellen)
const fixReq = (params.get('fixreq') || '').toUpperCase();
layers.forEach(L => {
  if (!fixReq.includes(L)) steps.push({ key: 'reset:' + L, kind: 'req', layer: L, interval: resetInterval[L] || 600 });
  AP.UPGRADE_ORDER[L].forEach((id, i) => steps.push({ key: id, kind: 'cost', id, interval: (interval[L] || interval.D)(i) }));
});

// alles noch nicht getunte sperren
steps.forEach(st => { if (st.kind === 'cost') AP.UPGRADES[st.id].cost = LOCK; else AP.LAYERS[st.layer].req = LOCK; });
const setP = (st, v) => { v = new Dec(v); if (st.kind === 'cost') AP.UPGRADES[st.id].cost = v; else AP.LAYERS[st.layer].req = v; };

// Startpunkt: Tor der Stufe vor der ersten getunten Stufe. Für spätere Stufen ab Snapshot weiterrechnen.
const first = tuneA ? 'A' : layers[0];
const gate = first === 'A' ? 'AB' : AP.LETTERS[AP.LETTERS.indexOf(first) - 1] + 'Z';
const fast = !tuneA && first >= 'D';
const DT = fast ? 0.5 : 1;
const startRun = AP.simulate({ stopAt: gate, snapshotAt: fast ? gate : null, dt: DT, maxTime: 12 * 3600 });
const snap = fast ? startRun.snapshot : null;
let prevT = startRun.bought[gate];
if (fixReq.includes(layers[0])) { prevT = AP.simulate({ stopAt: 'reset:' + layers[0], dt: DT, from: snap, maxTime: 12 * 3600 }).firstReset[layers[0]]; }
let prevLog = 0;
let k = 0;
const results = [];
function stepOnce() {
  if (k >= steps.length) return finish();
  const st = steps[k];
  const target = prevT + st.interval;
  const timeFor = v => {
    setP(st, v);
    const r = AP.simulate({ stopAt: st.key, dt: DT, from: snap, maxTime: target * 1.5 + 600 });
    if (!r.done) return Infinity;
    return st.kind === 'cost' ? r.bought[st.id] : r.firstReset[st.layer];
  };
  let lo = st.kind === 'cost' ? Math.max(0, prevLog) : 0, hi = lo + (st.kind === 'cost' ? 12 : 40);
  for (let it = 0; it < 18; it++) {
    const mid = (lo + hi) / 2;
    if (timeFor(fromLog(mid)) < target) lo = mid; else hi = mid;
  }
  let v = round2(lo);
  if (st.kind === 'cost' && v.lt(1)) v = new Dec(1);
  const t = timeFor(v);
  if (st.kind === 'cost') prevLog = Dec.max(v, 1).log10();
  if (st.kind === 'req') prevLog = 0;
  results.push({ key: st.key, v, t, target });
  out.textContent = results.map(r => r.key.padEnd(8) + String(r.v).padEnd(12) + AP.fmtT(r.t) + '  (Ziel ' + AP.fmtT(r.target) + ')').join('\n');
  prevT = isFinite(t) ? t : target;
  k++;
  setTimeout(stepOnce, 0);
}
function finish() {
  // Ausgabe passend für COSTS in upgrades.js: kleine Werte als Zahl, große als Text ('1.2e400')
  const one = v => v.lt(1e4) ? String(v.toNumber()) : v.gte('1e300') ? "'" + v.toString().replace('e+', 'e') + "'" : v.toString().replace('e+', 'e');
  const fmt = L => L + ': [' + AP.UPGRADE_ORDER[L].map(id => one(AP.UPGRADES[id].cost)).join(', ') + ']';
  window.tuneResult = Object.keys(AP.UPGRADE_ORDER).map(fmt).join(',\n') + '\n' + Object.keys(AP.LAYERS).filter(L => AP.LAYERS[L].source).map(L => 'req' + L + ': ' + AP.LAYERS[L].req.toString()).join('  ');
  out.textContent += '\n\nFERTIG\n' + window.tuneResult;
}
setTimeout(stepOnce, 0);
</script>
</body>
</html>
