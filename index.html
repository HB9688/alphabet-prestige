<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alphabet Prestige</title>
<!-- ?v=… bei jeder Änderung an CSS/JS erhöhen, damit Browser keine alte Datei aus dem Cache mit neuem HTML mischen -->
<link rel="stylesheet" href="style.css?v=35">
</head>
<body>
  <header>
    <div class="topbar">
      <!-- Zahnrad-Menü mit den Speicher-Optionen, Statistik-Icon, daneben „zuletzt gespeichert“ -->
      <div class="settings" id="settings">
        <button type="button" class="gear" id="gearBtn" aria-expanded="false" aria-controls="settingsMenu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button type="button" class="gear" id="statsBtn" aria-expanded="false" aria-controls="statsPanel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M8 17v-5"/><path d="M13 17V8"/><path d="M18 17v-8"/></svg>
        </button>
        <button type="button" class="gear" id="pauseBtn" aria-pressed="false">
          <svg class="ico-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14"/><path d="M15 5v14"/></svg>
          <svg class="ico-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
        </button>
        <span class="sub paused-info" id="pausedInfo" data-i18n="paused" hidden>Paused</span>
        <span class="sub" id="saveInfoTop"></span>
      </div>
      <!-- oben rechts: Info, Hilfe, Sprache (Englisch zuerst = Primärsprache) -->
      <div class="top-right" id="topRight">
        <button type="button" class="gear" id="infoBtn" aria-expanded="false" aria-controls="infoPanel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><path d="M12 7.5v.01"/></svg>
        </button>
        <button type="button" class="gear" id="helpBtn" aria-expanded="false" aria-controls="helpPanel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.3a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.4-2.7 4"/><path d="M12 17.3v.01"/></svg>
        </button>
        <div class="lang" role="group" id="langSwitch">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="de">DE</button>
        </div>
      </div>
      <!-- eigene Zeile unter Zahnrad/Sprache: schiebt Überschrift und Rest nach unten -->
      <div class="menu" id="settingsMenu" hidden>
        <section class="card small" id="saveCard">
          <button class="btn" id="saveBtn" data-i18n="save">Save</button>
          <button class="btn" id="exportBtn" data-i18n="export">Export</button>
          <button class="btn" id="importBtn" data-i18n="import">Import</button>
          <button class="btn danger" id="hardResetBtn" data-i18n="restart">Restart</button>
          <div class="sub" id="saveInfo"></div>
        </section>
      </div>
      <!-- Statistik: über das Diagramm-Icon neben dem Zahnrad -->
      <section class="card stats" id="statsPanel" hidden>
        <div class="stats-head">
          <div class="label" data-i18n="stats">Statistics</div>
          <button type="button" class="stats-close" id="statsClose">×</button>
        </div>
        <div id="statsBody"></div>
      </section>
      <!-- Info: Urheber, Version, Versionsgeschichte (Daten in js/info.js) -->
      <section class="card stats side-right" id="infoPanel" hidden>
        <div class="stats-head">
          <div class="label" data-i18n="info">Info</div>
          <button type="button" class="stats-close" id="infoClose">×</button>
        </div>
        <div id="infoBody"></div>
      </section>
      <!-- Hilfe: Ziel, Tastenkürzel (nur Desktop), Tipps -->
      <section class="card stats side-right" id="helpPanel" hidden>
        <div class="stats-head">
          <div class="label" data-i18n="help">Help</div>
          <button type="button" class="stats-close" id="helpClose">×</button>
        </div>
        <div id="helpBody"></div>
      </section>
    </div>
    <h1 id="title">Alphabet Prestige</h1>
    <div class="palette" id="palette" aria-hidden="true"></div>
  </header>

  <nav id="tabs" role="tablist"></nav>

  <main id="stage">
    <aside id="panel">
      <section class="card">
        <div class="label" data-i18n="points">Points</div>
        <div class="big" id="points">0</div>
        <div class="sub" id="rate">+0 /s</div>
      </section>

      <section class="card">
        <div class="label" id="layerLabel">A points</div>
        <div class="big" id="layerAmt">0</div>
        <div class="sub" id="passive"></div>
        <!-- entfällt, sobald die Stufe passiv erzeugt wird (dann steht oben „+x A /s“) -->
        <div id="resetInfo">
          <div class="label spaced" data-i18n="nextReset">Next reset</div>
          <div id="gain">+0 A</div>
          <div class="bar"><div class="fill" id="bar"></div></div>
          <div class="sub" id="req"></div>
        </div>
        <div class="sub" id="reqNext"></div>
        <!-- Reset-Knöpfe: aktuelle Stufe (2/3) und – auf jedem Tab mit Vorstufe immer – die Stufe darunter (1/3) -->
        <div class="reset-row">
          <button id="resetBtn" class="btn wide">A prestige</button>
          <button id="resetPrevBtn" class="btn wide"></button>
        </div>
      </section>


    </aside>

    <section class="card upcard">
      <div class="uphead">
        <div class="label" id="upTitle">A upgrades</div>
        <!-- Auto-Kauf (ab BG) direkt im Kopf der Upgrade-Liste -->
        <label class="autobuy" id="autoBuyRow" hidden><input type="checkbox" id="autoBuy"> <span data-i18n="autoBuy"></span></label>
        <div class="sub" id="upCount"></div>
      </div>
      <div id="upgrades"></div>
      <div class="done-note" id="doneNote"></div>
    </section>
  </main>

  <!-- Hinweis-Fenster während der Pause (mittig, blockiert die Knöpfe oben nicht) -->
  <div class="pause-overlay" id="pauseOverlay" hidden>
    <section class="card pause-card" role="status" aria-live="polite">
      <div class="pause-title" data-i18n="pausedTitle">Game paused</div>
      <p class="sub" id="pausedText"></p>
      <button type="button" class="btn wide" id="resumeBtn" data-i18n="resume">Resume</button>
    </section>
  </div>

  <!-- Willkommen zurück: Offline-Fortschritt -->
  <div class="pause-overlay" id="welcomeOverlay" hidden>
    <section class="card pause-card" role="dialog" aria-labelledby="welcomeTitle">
      <div class="pause-title" id="welcomeTitle" data-i18n="welcomeBack">Welcome back!</div>
      <p class="sub" id="welcomeText"></p>
      <ul class="welcome-gains" id="welcomeGains"></ul>
      <p class="sub" id="welcomeCap" hidden></p>
      <button type="button" class="btn wide" id="welcomeOk" data-i18n="ok">OK</button>
    </section>
  </div>

  <script src="js/lib/break_infinity.min.js?v=35"></script>
  <script src="js/palette.js?v=35"></script>
  <script src="js/i18n.js?v=35"></script>
  <script src="js/info.js?v=35"></script>
  <script src="js/upgrades.js?v=35"></script>
  <script src="js/game.js?v=35"></script>
  <script src="js/ui.js?v=35"></script>
</body>
</html>
